benchmark: medqa_usmle
dev_split: train
test_split: test
output_dir: outputs

retrieval:
  corpus: statpearls
  embedding_model: BAAI/bge-small-en-v1.5
  chunk_size: 512
  chunk_overlap: 64
  top_k_retrieve: 20
  top_k_rerank: 5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

verifier:
  min_chunks: 2

reformulator:
  max_retries: 2
